steps:
  # Step 1: Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/voyazo-backend', '.']

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/voyazo-backend']

images:
  - 'gcr.io/$PROJECT_ID/voyazo-backend'

options:
  logging: CLOUD_LOGGING_ONLY
